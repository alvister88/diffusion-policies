name: midas_image_hand_cond

image_shape: &image_shape [3, 240, 320]
shape_meta: &shape_meta
  obs:
    camera_0:
      shape: *image_shape
      type: rgb
    tactile_z:
      # [mean_z_thumb, max_z_thumb, mean_z_index, max_z_index] (raw per-taxel Fz)
      shape: [4]
      type: low_dim
  action:
    shape: [19]

env_runner:
  _target_: shared.env.midas.midas_runner.MidasRunner
  output_dir: ${hydra:runtime.output_dir}

dataset:
  _target_: shared.env.midas.midas_image_dataset.MidasImageDataset
  dataset_path:  /data/jun/Jonathan/data_midas10
  shape_meta: *shape_meta
  horizon: ${horizon}
  pad_before: ${eval:'${num_obs_steps}-1'}
  pad_after: ${eval:'${num_action_steps}-1'}
  seed: 42
  val_ratio: 0.15
  max_train_episodes: null
  num_obs_steps: ${dataset_obs_steps}
  num_latency_steps: ${num_latency_steps}
  first_cut: 0
  encoder_window: 0
  sync_downsample_stride: 2
  # Multiplicative camera-exposure gain applied to every training frame
  # (1.0 = unchanged). Overridden per-run via CLI (e.g. Task 3 uses 1.5).
  # NOTE: a policy trained with brightness != 1.0 needs the SAME gain applied
  # at deployment (executor image preprocessing), or train/deploy will mismatch.
  image_brightness: 1.0
  use_cache: False
